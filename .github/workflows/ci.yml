# =====================================================================
# 多语种文献翻译与论文研读助手 — GitHub Actions CI
# push: 单测 + ruff 基础正确性检查 + pytest 覆盖率门禁 + docker build（非阻断）
# nightly: 真实 DashScope 评测（约 30 分钟；未配置 key 时只提示，不阻断）
# =====================================================================

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # 文档 6.4 节：评测集 nightly（30 分钟级）
  schedule:
    - cron: '0 2 * * *'   # UTC 凌晨 2 点（北京时间 10 点）跑 nightly 评测

jobs:

  # -------------------------------------------------------------------
  # Job 1：核心模块单测（push 触发，每次必跑，文档 6.4 节）
  # -------------------------------------------------------------------
  unit-tests:
    name: Unit Tests (Python 3.13, mock mode)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock') }}

      - name: Install deps (locked versions)
        run: |
          python -m pip install --upgrade pip
          # 从 requirements.lock 精确安装，避免版本漂移（依赖已在本地验证）
          # 注意：lock 已含 streamlit==1.50.0（与 fastapi 0.110 / starlette 0.36 兼容），
          # 不要再单独 pip install streamlit（会拉到 1.51+ 并升级 starlette 导致测试崩溃）
          pip install -r requirements.lock
          # pytest 回归测试 + 覆盖率 + ruff 基础正确性检查
          pip install pytest pytest-cov coverage ruff

      - name: Verify syntax
        run: python -m compileall -q app tests

      - name: Lint (ruff minimal correctness)
        # 全量 ruff 规则待清理（历史风格告警多）；先守住语法/未定义名/严重错误
        run: python -m ruff check app tests --select E9,F63,F7,F82

      - name: Run pytest regression (core) + coverage gate
        # 不显式传路径：pytest 使用 pyproject testpaths=tests/unit，
        # 只收集 test_*.py，避免误扫 e2e 脚本与带参的 verify_*.py。
        # 覆盖率门槛 55% 为 pytest-only 口径；合并 verify 后的核心模块门控见 nightly
        run: python -m pytest -v --cov=app --cov-report=term --cov-fail-under=55

      - name: Run context_manager test
        run: python tests/unit/verify_context_manager.py

      - name: Run RAG test
        run: python tests/unit/verify_rag_pipeline.py

      - name: Run review test
        run: python tests/unit/verify_review_pipeline.py

      - name: Run parser test
        run: python tests/unit/verify_parser_pipeline.py

      - name: Run infrastructure test
        run: python tests/unit/verify_infrastructure.py

      - name: Run completion modules test (mock)
        # 翻译 / GB-T 7714 / 论文结构拆解；--mock 不产生 DashScope API 费用
        run: python tests/unit/verify_completion_modules.py --mock

      - name: Run Agent pipeline test (mock)
        # 工具注册 / ReAct / LangGraph 编排 / 边界恢复；离线 mock
        run: python tests/unit/verify_agent_pipeline.py

      - name: Run Agent evaluation (mock)
        # 任务成功率 / 工具选择准确率 / 平均步数 / 成本；离线 mock
        run: python tests/eval/run_agent_eval.py --mode mock --output report_agent.json

      - name: Run E2E mock
        run: python tests/e2e/test_e2e_mock.py

  # -------------------------------------------------------------------
  # Job 2：Docker 构建证据（非阻断；首次运行后确认结果，稳定后可改阻断）
  # -------------------------------------------------------------------
  docker-build:
    name: Docker Build (non-blocking evidence)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t paper-research-assistant:ci .

      - name: Validate compose config
        run: docker compose config

  # -------------------------------------------------------------------
  # Job 3：Nightly 全量评测（文档 6.4 节，约 30 分钟）
  # -------------------------------------------------------------------
  nightly-eval:
    name: Nightly Eval (DashScope real API)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-full-${{ hashFiles('requirements.txt') }}

      - name: Install full deps
        run: |
          python -m pip install --upgrade pip
          # 与 unit-tests 一致从 lock 安装，避免解析出与 fastapi 0.110 冲突的 starlette
          pip install -r requirements.lock || pip install numpy scikit-learn regex dashscope

      - name: Verify DashScope API key
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::warning::未配置 Secrets.DASHSCOPE_API_KEY，真实评测跳过";
          else
            echo "DASHSCOPE_API_KEY 已配置 ✓"
          fi

      - name: Build QA dataset
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python tests/qa_dataset/build_dataset.py || echo "数据集未构建（可能缺 key 或样例数据不足）"

      - name: Run unit tests (baseline)
        run: |
          python tests/unit/verify_context_manager.py
          python tests/unit/verify_rag_pipeline.py
          python tests/unit/verify_review_pipeline.py
          python tests/unit/verify_parser_pipeline.py
          python tests/unit/verify_infrastructure.py
          python tests/unit/verify_completion_modules.py --mock

      - name: Run pytest regression + coverage
        run: |
          python -m pytest --cov=app --cov-report=term --cov-report=xml

      - name: Coverage gate (core modules >= 85%)
        run: |
          # 覆盖率必须合并 verify 脚本 + pytest，否则核心模块被低估
          make coverage
          make coverage-check
        continue-on-error: true

      - name: Run E2E DashScope real
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: python tests/e2e/test_e2e_dashscope.py || echo "DashScope E2E 执行失败，请检查 API key / 网络"

      - name: Run evaluation
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python tests/eval/run_eval.py --mode nightly --output report.json || true

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-report
          path: |
            report.json
            logs/app.log
          if-no-files-found: ignore
