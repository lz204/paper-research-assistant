# =====================================================================
# 多语种文献翻译与论文研读助手 — docker-compose.yml
# 设计：不上 K8s，单机部署；总内存占用 < 2GB（纯 CPU）。
#
# 默认启动（docker compose up -d / make up）：
#   - app     : FastAPI 后端（项目根目录 Dockerfile）
#   - frontend: Streamlit 前端（复用同一镜像，CMD 切换为 streamlit run）
#
# 可选服务（--profile full 时启动，接口预留、当前代码默认内存版）：
#   - db     : PostgreSQL + pgvector（向量索引 / 成本看板落库，接口已预留）
#   - redis  : Redis（长时记忆池 / 缓存，接口已预留）
#   注：默认不启动它们，因为当前实现为进程内内存版，避免"起了容器但没接线"。
#   后续落地 pgvector/PgCostTracker 时使用：
#     docker compose --profile full up -d
#
# 使用：
#   cp .env.example .env   # 填入 DASHSCOPE_API_KEY
#   docker compose up -d   # 或 make up
# =====================================================================

services:

  # ---------------------------------------------------------------------
  # PostgreSQL + pgvector（文档 4.2 节向量索引 + 文档 6.1 节成本看板）
  # 当前为接口预留：PgvectorRetriever / PgCostTracker 尚未实现，默认不启动
  # ---------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: pra-db
    profiles: ["full"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: paper_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg_pw_2024
    volumes:
      - pra_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paper_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  # ---------------------------------------------------------------------
  # Redis（文档 4.2 节 KV 长时记忆池 + Celery broker）
  # 当前为接口预留：默认不启动（见文件头说明）
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pra-redis
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m

  # ---------------------------------------------------------------------
  # FastAPI 后端
  # ---------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pra-app
    restart: unless-stopped
    # 不依赖 db/redis：默认部署下二者未启动，且当前实现为进程内内存版；
    # 需要 pgvector/Redis 时用 --profile full 启动并在代码中接线。
    environment:
      # 容器内部互联：服务名作为 hostname（--profile full 时使用）
      DATABASE_URL: postgresql://postgres:pg_pw_2024@db:5432/paper_assistant
      REDIS_URL: redis://redis:6379/0
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_ENV: production
      # --- DashScope API Key（从 .env 透传，或 docker compose run -e 设置）---
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      APP_LOG_FILE: logs/app.log
    volumes:
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    mem_limit: 1024m
    command: >
      sh -c "python -m uvicorn app.api.routes:create_app --factory
      --host 0.0.0.0 --port 8000"

  # ---------------------------------------------------------------------
  # Streamlit 前端（文档 10 章：Streamlit 够用就好，不写 React）
  # 复用 app 镜像，只改启动命令
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pra-frontend
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Streamlit 前端通过容器名访问后端 API
      API_BASE_URL: http://app:8000
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      APP_ENV: production
    volumes:
      - ./logs:/app/logs
    ports:
      - "8501:8501"
    mem_limit: 768m
    command: >
      sh -c "streamlit run app/frontend/streamlit_app.py
      --server.port 8501 --server.headless true
      --server.address 0.0.0.0"

volumes:
  pra_pgdata:
    driver: local
