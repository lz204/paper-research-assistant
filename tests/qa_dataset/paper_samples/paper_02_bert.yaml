# Sample Paper 2: BERT — Pretraining of Deep Bidirectional Transformers

paper_id: sample_paper_2
title: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding"
year: 2018
authors: "Devlin et al."
url: "https://arxiv.org/abs/1810.04805"
keywords: ["BERT", "Masked Language Modeling", "Next Sentence Prediction", "Fine-tuning"]

chunks:
  - chunk_id: "sample_paper_2#0.0"
    section: "Abstract"
    text: |
      We introduce a new language representation model called BERT, which stands for
      Bidirectional Encoder Representations from Transformers. Unlike recent language
      representation models, BERT is designed to pre-train deep bidirectional
      representations from unlabeled text by jointly conditioning on both left and
      right context in all layers.
  - chunk_id: "sample_paper_2#0.1"
    section: "Introduction"
    text: |
      Pre-training general-purpose language representations followed by fine-tuning on
      specific tasks has become a standard approach. BERT advances this idea by using
      a Masked Language Modeling (MLM) objective during pre-training. For a given
      sentence, 15% of WordPiece tokens are randomly masked, and the model learns
      to predict the original vocabulary ID of the masked words.
  - chunk_id: "sample_paper_2#1.0"
    section: "Method"
    text: |
      BERT's model architecture is a multi-layer bidirectional Transformer encoder.
      We release two model sizes: BERT_BASE (L=12, H=768, A=12, 110M parameters)
      and BERT_LARGE (L=24, H=1024, A=16, 340M parameters).
      Training objectives:
        (1) Masked Language Modeling (MLM) — bidirectional representation.
        (2) Next Sentence Prediction (NSP) — binary classification of whether
            Sentence B follows Sentence A in the original document.
  - chunk_id: "sample_paper_2#2.0"
    section: "Results"
    text: |
      GLUE benchmark: BERT_LARGE achieves 80.5% average score, outperforming all prior
      single models by up to 7%. SQuAD v1.1 F1: 93.2% (new SOTA). SQuAD v2.0 F1: 83.1%.
      MultiNLI Matched accuracy: 86.7%. All results exceed prior models significantly.
  - chunk_id: "sample_paper_2#3.0"
    section: "Ablation"
    text: |
      Removing NSP objective causes a 0.7% drop on SWAG accuracy and 0.4% drop on
      SQuAD. Bidirectional context is crucial: unidirectional left-only LSTM-style
      encoding reduces SQuAD F1 by 3.5%. BERT_BASE with bidirectional MLM is better
      than larger left-only unidirectional models.
